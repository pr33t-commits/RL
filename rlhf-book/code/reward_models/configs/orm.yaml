# Outcome Reward Model Configuration
# Token-level correctness classification on GSM8K.
#
# Run with:
#   uv run python -m reward_models.train_orm \
#     --config reward_models/configs/orm.yaml

# Model
model_id: Qwen/Qwen3-0.6B-Base
freeze_backbone: true

# Dataset
dataset_name: reward_models/data/gsm8k_gpt4.jsonl
dataset_split: train
samples: 100

# Training
batch_size: 8
grad_accum_steps: 4
epochs: 3
lr: 1.0e-4
warmup_ratio: 0.1
lr_scheduler: warmup_only
seed: 7

# Hardware
device: cpu
device_id: 0

# Logging / demo
use_wandb: true
skip_demo: false
